name: Build Installer From Branch

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: GMonster branch, tag, or commit SHA to package
        required: true
        default: installer
      release_version:
        description: Installer version, for example 2.2.0
        required: true
        default: 2.2.0
      wum_ref:
        description: WUM branch, tag, or full 40-character commit SHA to package
        required: true
        default: 227101e8aedddf8dad2dcff51d8df4fd01d3f48b
      console_build:
        description: Package a console executable for manual diagnostics (normal customer installer is false)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wum:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moeezmujahid70/WUM-App
          ref: ${{ inputs.wum_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install WUM dependencies and build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --clean WUM.spec
      - uses: actions/upload-artifact@v4
        with:
          name: wum-exe
          path: dist/WUM.exe
          if-no-files-found: error

  build-gmonster:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies and smoke-test GMonster diagnostics build
        env:
          GMONSTER_CONSOLE_BUILD: '1'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-updated.txt
          pip install pyinstaller
          pyinstaller --clean GMonster.spec
          $smokeTestLog = Join-Path $env:RUNNER_TEMP "gmonster-smoke-test.log"
          $env:GMONSTER_SMOKE_TEST_LOG = $smokeTestLog
          & .\dist\GMonster.exe --smoke-test
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $smokeTestLog) { Get-Content $smokeTestLog }
            throw "GMonster diagnostics smoke test failed"
          }
      - name: Build GMonster release executable
        env:
          GMONSTER_CONSOLE_BUILD: ${{ inputs.console_build && '1' || '0' }}
        run: |
          pyinstaller --clean GMonster.spec
      - uses: actions/upload-artifact@v4
        with:
          name: gmonster-exe
          path: dist/GMonster.exe
          if-no-files-found: error

  package-installer:
    needs: [build-wum, build-gmonster]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gmonster-exe
          path: release-input/gmonster
      - uses: actions/download-artifact@v4
        with:
          name: wum-exe
          path: release-input/wum
      - name: Smoke-test Windows executables
        shell: pwsh
        run: |
          if ('${{ inputs.console_build }}' -eq 'true') {
            & .\release-input\gmonster\GMonster.exe --smoke-test
            if ($LASTEXITCODE -ne 0) { throw "GMonster console smoke test failed" }
          } else {
            $gmonster = Start-Process `
              -FilePath .\release-input\gmonster\GMonster.exe `
              -WorkingDirectory .\release-input\gmonster `
              -PassThru
            try {
              Start-Sleep -Seconds 5
              if ($gmonster.HasExited) {
                throw "GMonster windowed startup smoke test failed"
              }
            } finally {
              if (-not $gmonster.HasExited) {
                Stop-Process -Id $gmonster.Id -Force
              }
            }
          }
          & .\release-input\wum\WUM.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "WUM smoke test failed" }
      - name: Stage installer files
        shell: pwsh
        run: |
          .\scripts\stage_windows_release.ps1 `
            -GMonsterExePath .\release-input\gmonster\GMonster.exe `
            -WumExePath .\release-input\wum\WUM.exe
      - name: Install Inno Setup and create installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          choco install innosetup --no-progress --yes
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:RELEASE_VERSION" installer\GMonster.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GMonster-${{ inputs.release_version }}-Setup
          path: release/GMonster-${{ inputs.release_version }}-Setup.exe
          if-no-files-found: error
